<style>
/* Layout: almanac page — big month + 절기 masthead, scrollable month strip, ruled ingredient lists with a 12-month 제철 bar per item */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #1d2420;
  --muted: #5d6862;
  --line: #d6ddd8;
  --accent: #b5541c;      /* overridden per season */
  --accent-soft: #f6e3d6;
  --on-accent: #ffffff;
  --font-display: "Jua", "Gowun Batang", "Malgun Gothic", sans-serif;
  --st-sea: #d9ecff; --st-veg: #def4d3; --st-fruit: #ffe2d9;
  --sticker-edge: #ffffff;
  --font-body: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
:root[data-season="spring"] { --accent: #3f7d3a; --accent-soft: #e2efdc; }
:root[data-season="summer"] { --accent: #1f6f8b; --accent-soft: #dbecf2; }
:root[data-season="autumn"] { --accent: #b5541c; --accent-soft: #f6e3d6; }
:root[data-season="winter"] { --accent: #3b4a8c; --accent-soft: #e1e4f3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --st-sea: #233547; --st-veg: #263b27; --st-fruit: #45302a; --sticker-edge: #2c3530; --bg: #151a17; --surface: #1d2420; --ink: #e8ece9; --muted: #9aa69f; --line: #2f3833; color-scheme: dark; }
  :root:not([data-theme="light"])[data-season="spring"] { --accent: #8fc985; --accent-soft: #233322; --on-accent: #10200e; }
  :root:not([data-theme="light"])[data-season="summer"] { --accent: #7cc3dc; --accent-soft: #1b2f37; --on-accent: #0b1f27; }
  :root:not([data-theme="light"])[data-season="autumn"] { --accent: #f0a06b; --accent-soft: #3a2619; --on-accent: #2a1305; }
  :root:not([data-theme="light"])[data-season="winter"] { --accent: #9eabf0; --accent-soft: #252a45; --on-accent: #12183a; }
}
:root[data-theme="dark"] { --st-sea: #233547; --st-veg: #263b27; --st-fruit: #45302a; --sticker-edge: #2c3530; --bg: #151a17; --surface: #1d2420; --ink: #e8ece9; --muted: #9aa69f; --line: #2f3833; color-scheme: dark; }
:root[data-theme="dark"][data-season="spring"] { --accent: #8fc985; --accent-soft: #233322; --on-accent: #10200e; }
:root[data-theme="dark"][data-season="summer"] { --accent: #7cc3dc; --accent-soft: #1b2f37; --on-accent: #0b1f27; }
:root[data-theme="dark"][data-season="autumn"] { --accent: #f0a06b; --accent-soft: #3a2619; --on-accent: #2a1305; }
:root[data-theme="dark"][data-season="winter"] { --accent: #9eabf0; --accent-soft: #252a45; --on-accent: #12183a; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  transition: background .2s;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 24px; }

header.mast { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 22px; align-items: end; }
.buddy { display: flex; align-items: flex-end; gap: 6px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
.buddy svg { width: 92px; height: 92px; flex: none; animation: bob 2.6s ease-in-out infinite; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 8px 12px; font-family: var(--font-display); font-size: 15px; max-width: 190px; margin-bottom: 52px; line-height: 1.35; text-align: left; }
.bubble::after { content: ""; position: absolute; right: -9px; bottom: 12px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
@media (max-width: 600px) { header.mast { grid-template-columns: auto 1fr; } .buddy { grid-column: 1 / -1; justify-self: end; } .bubble { margin-bottom: 40px; } }
.month-big { font-family: var(--font-display); font-weight: 700; font-size: clamp(64px, 14vw, 112px); line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
.month-big small { font-size: .35em; margin-left: 4px; color: var(--ink); }
.mast-text { display: grid; gap: 6px; min-width: 0; padding-bottom: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.mast h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4.4vw, 32px); line-height: 1.3; text-wrap: balance; }
.terms { display: flex; flex-wrap: wrap; gap: 8px; }
.term { font-size: 13px; color: var(--muted); }
.term b { color: var(--ink); font-family: var(--font-display); font-size: 15px; margin-right: 4px; }

.strip { overflow-x: auto; scrollbar-width: thin; margin: 0 -4px; padding: 4px; }
.strip-inner { display: grid; grid-template-columns: repeat(12, minmax(48px, 1fr)); gap: 4px; min-width: 600px; }
.mbtn {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);

  살구: "베타카로틴이 풍부해요|주황빛이 진하고 향이 좋은 것|냉장, 빨리 먹기|그대로·살구잼",
  수박: "수분이 90% 이상, 시트룰린이 있어요|두드리면 맑은 소리, 줄무늬가 선명한 것|자른 건 랩 씌워 냉장|수박화채·주스",
  블루베리: "안토시아닌이 풍부한 슈퍼푸드|하얀 분이 고르게 묻은 것|씻지 말고 냉장, 냉동 가능|요거트와 함께·스무디",
  복숭아: "비타민A·C와 식이섬유|향이 진하고 꼭지 주변까지 색이 든 것|실온에서 후숙, 먹기 전에 잠깐 냉장|그대로·병조림",
  자두: "식이섬유와 비타민|흰 분이 있고 살짝 말랑해지기 직전|냉장|그대로·자두잼",
  무화과: "식이섬유와 소화를 돕는 효소|꼭지 쪽까지 색이 들고 살짝 갈라진 것|금방 무르니 1~2일 안에|그대로, 치즈와 함께",
  포도: "폴리페놀(레스베라트롤)이 풍부|송이가 단단하고 흰 분이 있는 것|씻지 말고 냉장|그대로·포도주스",
  배: "수분이 많고 기관지 건강에 좋다고 알려져요|묵직하고 껍질이 매끈한 것|하나씩 싸서 냉장|그대로·배숙·고기 양념",
  사과: "펙틴(식이섬유)과 폴리페놀|단단하고 꼭지가 싱싱한 것|비닐에 싸서 냉장 (다른 과일과 따로)|아침에 껍질째",
  감: "비타민C와 비타민A가 풍부|꼭지가 붙어 있고 색이 고른 것|단감은 냉장, 떫은 감은 홍시로 후숙|단감·홍시·곶감",
  석류: "엘라그산 같은 폴리페놀이 많아요|껍질이 단단하고 묵직한 것|냉장, 알만 빼서 냉동|알갱이 그대로·주스",
  모과: "기침 완화에 좋다고 알려진 유기산|노랗고 향이 진한 것|실온에 두면 방향제가 돼요|모과청·모과차",
  밤: "탄수화물과 비타민C|껍질에 윤기가 있고 묵직한 것|냉장, 오래 두려면 냉동|군밤·밤밥",
  은행: "단백질과 비타민|껍질이 희고 알이 굵은 것|껍질째 냉장|구워서 간식으로 (하루 10알 이내로만!)",
  대추: "철분과 식이섬유, 마음을 안정시킨다고 알려져요|생대추는 단단하고 윤기 나는 것|생대추는 냉장, 말린 건 실온|생대추·대추차·삼계탕",
  유자: "비타민C가 레몬보다 많아요|껍질이 울퉁불퉁하고 향이 진한 것|바로 청으로 담그기|유자청·유자차",
  키위: "비타민C가 풍부하고 고기를 연하게 하는 효소가 있어요|살짝 말랑한 것이 먹기 좋아요|단단하면 실온에서 후숙|그대로, 고기 재울 때",
};
const INFO_LABELS = ["영양", "고르는 법", "보관", "이렇게 먹어요"];
const ART_CACHE = {};
function art(name) {
  if (!(name in ART_CACHE)) ART_CACHE[name] = ART[name] ? `<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="60" rx="17" ry="2.8" fill="#000" opacity=".13"/>${ART[name]()}</svg>` : null;
  return ART_CACHE[name];
}
function sticker(name) {
  const cat = INDEX[name].cat;
  return `<span class="stk stk-${cat}" aria-hidden="true">${art(name) || EMO[name] || CAT_EMO[cat]}</span>`;
}
let buddyPick = 0;
function buddySay() {
  const all = CATS.flatMap(c => DATA[month][c.id].map(s => s.split("|")[0]));
  const n = all[buddyPick % all.length];
  $("bubble").textContent = `${month}월엔 ${n}${josa(n)} 제일 맛있어요! ${EMO[n] || CAT_EMO[INDEX[n].cat]}`;
}

// 재료 이름 → 제철인 달 목록
const INDEX = {};
for (let m = 1; m <= 12; m++) for (const c of CATS) for (const s of DATA[m][c.id]) {
  const [name, note] = s.split("|");
  (INDEX[name] ||= { cat: c.id, months: new Set(), notes: {} }).months.add(m);
  INDEX[name].notes[m] = note;
}

const thisMonth = new Date().getMonth() + 1;
let month = thisMonth, cat = "all", query = "";
const open = new Set();
let view = "month";
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("seasonal-favs") || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("seasonal-favs", JSON.stringify([...favs])); } catch (e) {} };
try { const saved = localStorage.getItem("seasonal-cat"); if (saved) cat = saved; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function monthsText(set) {
  const a = [...set].sort((x, y) => x - y);
  // 연속 구간으로 묶기 (12월→1월 이어짐 포함)
  if (a.length === 12) return "일 년 내내";
  const runs = [];
  for (const m of a) { const r = runs[runs.length - 1]; if (r && m === r[1] + 1) r[1] = m; else runs.push([m, m]); }
  if (runs.length > 1 && runs[0][0] === 1 && runs[runs.length - 1][1] === 12) { const last = runs.pop(); runs[0][0] = last[0]; }
  return runs.map(([s, e]) => s === e ? `${s}월` : `${s}~${e}월`).join(", ");
}

function bar(name) {
  const on = INDEX[name].months;
  let h = '<div class="bar" aria-hidden="true">';
  for (let m = 1; m <= 12; m++) h += `<i class="${on.has(m) ? "on" : ""}${m === thisMonth ? " cur" : ""}">${m}</i>`;
  return h + "</div>";
}

function facts(name) {
  if (!INFO[name]) return "";
  const parts = INFO[name].split("|");
  return `<dl class="facts facts-${INDEX[name].cat}">${parts.map((p, i) => `<dt>${INFO_LABELS[i]}</dt><dd>${esc(p)}</dd>`).join("")}</dl>`;
}

function rowHTML(name, note, showMonths) {
  const key = name;
  const isOpen = open.has(key);
  return `<li><button class="row" data-key="${esc(key)}" aria-expanded="${isOpen}">${sticker(name)}<span class="txt">
    <span class="name">${esc(name)}${favs.has(name) ? '<span class="heart" aria-label="찜함">♥</span>' : ""}${showMonths ? `<span class="mo">${monthsText(INDEX[name].months)}</span>` : ""}</span>
    <span class="note">${esc(note)}</span></span></button>
    ${isOpen ? `<div class="detail">${facts(name)}${bar(name)}<small>제철: ${monthsText(INDEX[name].months)} · 테두리 칸이 이번 달</small><button class="fav" data-fav="${esc(name)}" aria-pressed="${favs.has(name)}">${favs.has(name) ? "♥ 찜했어요" : "♡ 찜하기"}</button></div>` : ""}</li>`;
}

function render() {
  const season = SEASON(month);
  document.documentElement.dataset.season = season;
  $("bigMonth").innerHTML = `${month}<small>월</small>`;
  $("seasonLabel").innerHTML = `<span class="deco">${DECO[season]}</span>${SEASON_KO[season]}`;
  buddySay();
  $("headline").textContent = month === thisMonth ? "지금 가장 맛있는 제철 음식" : `${month}월의 제철 음식`;
  $("terms").innerHTML = DATA[month].terms.map(([t, d]) => `<span class="term"><b>${t}</b>${d}</span>`).join("");

  $("strip").innerHTML = Array.from({ length: 12 }, (_, i) => {
    const m = i + 1;
    return `<button class="mbtn" data-m="${m}" aria-pressed="${m === month}"><span class="n">${m}</span><span class="s">${SEASON_KO[SEASON(m)].split(" ")[0]}</span>${m === thisMonth ? '<span class="now" title="이번 달"></span>' : ""}</button>`;
  }).join("");

  $("chips").innerHTML = [{ id: "all", label: "전체" }, ...CATS].map(c =>
    `<button class="chip" data-c="${c.id}" aria-pressed="${c.id === cat}">${c.label}</button>`).join("");

  const shown = CATS.filter(c => cat === "all" || c.id === cat);
  const q = query.trim();
  $("pick").hidden = !!q || view === "fav";
  $("favhead").hidden = view !== "fav";
  document.querySelector("header.mast").hidden = view === "fav";
  document.querySelector(".strip").hidden = view === "fav";
  $("favcnt").hidden = !favs.size; $("favcnt").textContent = favs.size;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.tab === (view === "fav" ? "fav" : (q ? "search" : "month")))));

  if (view === "fav" && !q) {
    const list = [...favs].filter(n => INDEX[n]);
    const nowCnt = list.filter(n => INDEX[n].months.has(thisMonth)).length;
    $("favsub").textContent = list.length ? `${list.length}개 중 ${nowCnt}개가 지금(${thisMonth}월) 제철이에요.` : "재료를 눌러 펼친 뒤 '찜하기'를 누르면 여기 모여요.";
    if (!list.length) { $("cols").innerHTML = ""; return; }
    list.forEach(n => open.add(n));
    $("cols").innerHTML = shown.map(c => {
      const items = list.filter(n => INDEX[n].cat === c.id).sort((a, b) => INDEX[b].months.has(thisMonth) - INDEX[a].months.has(thisMonth));
      if (!items.length) return "";
      return `<section class="cat"><h3>${c.label}<span>${items.length}개</span></h3><ul class="list">${
        items.map(n => { const ms = [...INDEX[n].months]; const m = INDEX[n].months.has(thisMonth) ? thisMonth : ms[0]; return rowHTML(n, INDEX[n].notes[m], true).replace('<span class="mo">', INDEX[n].months.has(thisMonth) ? '<span class="in-season">지금 제철</span><span class="mo">' : '<span class="mo">'); }).join("")
      }</ul></section>`;
    }).join("") || `<p class="empty">이 분류에는 찜한 재료가 없어요.</p>`;
    return;
  }

  if (q) {
    const hits = Object.keys(INDEX).filter(n => n.includes(q));
    if (!hits.length) { $("cols").innerHTML = `<p class="empty">'${esc(q)}'에 해당하는 재료가 없어요. 다른 이름으로 검색해 보세요.</p>`; return; }
    hits.forEach(n => open.add(n));
    $("cols").innerHTML = shown.map(c => {
      const items = hits.filter(n => INDEX[n].cat === c.id);
      if (!items.length) return "";
      return `<section class="cat"><h3>${c.label}<span>${items.length}개</span></h3><ul class="list">${
        items.map(n => { const ms = [...INDEX[n].months]; const m = INDEX[n].months.has(thisMonth) ? thisMonth : ms[0]; return rowHTML(n, INDEX[n].notes[m], true); }).join("")
      }</ul></section>`;
    }).join("") || `<p class="empty">이 분류에는 '${esc(q)}' 재료가 없어요.</p>`;
    return;
  }

  $("menus").innerHTML = DATA[month].menu.map(x => `<li><span class="emo">${menuEmo(x)}</span>${esc(x)}</li>`).join("");
  $("cols").innerHTML = shown.map(c => {
    const items = DATA[month][c.id];
    return `<section class="cat"><h3>${c.label}<span>${items.length}개</span></h3><ul class="list">${
      items.map(s => { const [n, note] = s.split("|"); return rowHTML(n, note, false); }).join("")
    }</ul></section>`;
  }).join("");
}

$("strip").addEventListener("click", e => {
  const b = e.target.closest(".mbtn"); if (!b) return;
  month = +b.dataset.m; buddyPick = 0; query = ""; $("q").value = ""; open.clear(); render();
});
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.c; try { localStorage.setItem("seasonal-cat", cat); } catch (err) {} render();
});
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
$("cols").addEventListener("click", e => {
  const f = e.target.closest(".fav");
  if (f) {
    const n = f.dataset.fav;
    if (favs.has(n)) { favs.delete(n); toast(`${n} 찜 해제`); } else { favs.add(n); toast(`${n} 찜했어요 ♥`); if (navigator.vibrate) navigator.vibrate(10); }
    saveFavs(); render(); return;
  }
  const b = e.target.closest(".row"); if (!b) return;
  const k = b.dataset.key; open.has(k) ? open.delete(k) : open.add(k); render();
  const again = document.querySelector(`.row[data-key="${CSS.escape(k)}"]`); if (again) again.focus();
});
$("buddy").addEventListener("click", () => { buddyPick++; buddySay(); });
$("q").addEventListener("input", e => { query = e.target.value; if (!query.trim()) open.clear(); render(); });
document.querySelector(".tabbar").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  const tab = t.dataset.tab;
  if (tab === "month") { view = "month"; query = ""; $("q").value = ""; open.clear(); if (month !== thisMonth) { month = thisMonth; buddyPick = 0; } render(); centerStrip(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (tab === "fav") { view = "fav"; query = ""; $("q").value = ""; open.clear(); render(); window.scrollTo({ top: 0 }); }
  else { view = "month"; render(); $("q").focus(); $("q").scrollIntoView({ block: "center", behavior: "smooth" }); }
});
function centerStrip() { const c = document.querySelector(`.mbtn[data-m="${month}"]`), s = document.querySelector(".strip"); if (c && s) s.scrollLeft = c.offsetLeft - (s.clientWidth - c.offsetWidth) / 2; }


render();
// 선택된 달이 보이도록 스트립 스크롤
const cur = document.querySelector(`.mbtn[data-m="${month}"]`), strip = document.querySelector(".strip");
if (cur && strip) strip.scrollLeft = cur.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2;
</script>

</body></html>
