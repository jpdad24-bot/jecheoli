<style>
/* Layout: almanac page — big month + 절기 masthead, scrollable month strip, ruled ingredient lists with a 12-month 제철 bar per item */
:root {
  --bg: #fff8ec;
  --surface: #ffffff;
  --ink: #2a1d12;
  --muted: #7a6249;
  --line: #f0dfc4;
  --accent: #ffad01;
  --accent-soft: #ffeec9;
  --on-accent: #2a1d12;
  --accent-ink: #b06800;
  --font-display: "Jua", "Gowun Batang", "Malgun Gothic", sans-serif;
  --st-sea: #d9ecff; --st-veg: #def4d3; --st-fruit: #ffe2d9; --st-jp: #fbe3ec;
  --sticker-edge: #ffffff;
  --font-body: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --st-sea: #233547; --st-veg: #263b27; --st-fruit: #45302a; --st-jp: #40262f; --sticker-edge: #3d2e20; --bg: #1b140d; --surface: #271d14; --ink: #f6ead9; --muted: #bba68c; --line: #3d2e20; --accent: #ffb320; --accent-soft: #3b2b12; --on-accent: #22170b; --accent-ink: #ffc04f; color-scheme: dark; }
}
:root[data-theme="dark"] { --st-sea: #233547; --st-veg: #263b27; --st-fruit: #45302a; --st-jp: #40262f; --sticker-edge: #3d2e20; --bg: #1b140d; --surface: #271d14; --ink: #f6ead9; --muted: #bba68c; --line: #3d2e20; --accent: #ffb320; --accent-soft: #3b2b12; --on-accent: #22170b; --accent-ink: #ffc04f; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  transition: background .2s;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 24px; }

header.mast { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 22px; align-items: end;
  --ink: #2a1d12; --muted: #6b4708; --surface: #fffaf0;
  background: var(--accent); color: var(--ink); border-radius: 28px; padding: 22px 22px 18px; position: relative; overflow: hidden; }
header.mast::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.18); pointer-events: none; }
header.mast > * { position: relative; z-index: 1; }
.buddy { display: flex; align-items: flex-end; gap: 6px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
.buddy-img { height: 230px; width: auto; flex: none; margin: 0 -8px -18px 0; transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(90,50,0,.22)); }
@keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
header.mast .buddy { align-self: end; }
header.mast .bubble { margin-bottom: 120px; }
@media (max-width: 600px) { .buddy-img { height: 210px; } header.mast .bubble { margin-bottom: 104px; } }
.bubble { position: relative; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px; padding: 8px 12px; font-family: var(--font-display); font-size: 15px; max-width: 190px; margin-bottom: 52px; line-height: 1.35; text-align: left; }
.bubble::after { content: ""; position: absolute; right: -9px; bottom: 12px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
@media (max-width: 600px) { header.mast { grid-template-columns: auto 1fr; } .buddy { grid-column: 1 / -1; justify-self: end; } .bubble { margin-bottom: 40px; } }
.month-big { font-family: var(--font-display); font-weight: 700; font-size: clamp(64px, 14vw, 112px); line-height: .9; color: var(--ink); font-variant-numeric: tabular-nums; }
.month-big small { font-size: .35em; margin-left: 4px; color: var(--ink); }
.mast-text { display: grid; gap: 6px; min-width: 0; padding-bottom: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.mast h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4.4vw, 32px); line-height: 1.3; text-wrap: balance; }
.terms { display: flex; flex-wrap: wrap; gap: 8px; }
.term { font-size: 13px; color: var(--muted); }
.term b { color: var(--ink); font-family: var(--font-display); font-size: 15px; margin-right: 4px; }

.strip { overflow-x: auto; scrollbar-width: thin; margin: 0 -4px; padding: 4px; }
.strip-inner { display: grid; grid-template-columns: repeat(12, minmax(48px, 1fr)); gap: 4px; min-width: 600px; }
.mbtn {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 8px 0 6px; display: grid; gap: 2px; justify-items: center;
}
.mbtn .n { font-family: var(--font-display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mbtn .s { font-size: 10px; color: var(--muted); letter-spacing: .05em; }
.mbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mbtn[aria-pressed="true"] .s { color: var(--on-accent); opacity: .85; }
.mbtn .now { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.mbtn[aria-pressed="true"] .now { background: var(--on-accent); }
.mbtn:focus-visible, .chip:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 14px; cursor: pointer; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }

.pick { background: var(--accent-soft); border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; }
.pick h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.menus { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.menus .menu { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: transform .15s, border-color .15s; }
.menus .menu:hover { border-color: var(--accent); }
.menus .menu:active { transform: scale(.96); }
.pick-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.pick-hint { color: var(--muted); font-size: 12px; }
.dice { font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--accent); color: var(--on-accent); }
.dice:active { transform: scale(.96); }
.dice.rolling { animation: wob .5s ease-in-out; }
@keyframes wob { 25% { transform: rotate(-6deg) scale(1.05); } 75% { transform: rotate(6deg) scale(1.05); } }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); animation: up .28s cubic-bezier(.2,.9,.3,1); }
@media (min-width: 640px) { .sheet { left: 50%; right: auto; width: 560px; transform: translateX(-50%); animation: none; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.rc { display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
.rc-top { display: flex; gap: 14px; align-items: center; }
.rc-emo { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 34px; }
.rc-top h2 { margin: 2px 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.rc-meta { margin: 0; color: var(--muted); font-size: 13px; }
.rc h3 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.rc-ing { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rc-ing li { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.rc-ing li.in { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.rc-steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.rc-steps li::marker { color: var(--accent-ink); font-weight: 700; }
.rc-note { color: var(--muted); font-size: 12px; margin: 0; }
.rc-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.close { font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 18px; }
.menu:focus-visible, .dice:focus-visible, .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px 28px; align-items: start; }
.cat { min-width: 0; }
.cat h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 22px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.cat h3 span { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-bottom: 1px solid var(--line); }
.row { width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 10px 2px; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
.row .txt { display: grid; gap: 2px; min-width: 0; }
.stk { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; line-height: 1; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.stk svg { width: 50px; height: 50px; overflow: visible; }
.stk-sea { background: var(--st-sea); } .stk-veg { background: var(--st-veg); } .stk-fruit { background: var(--st-fruit); } .stk-jp { background: var(--st-jp); }
.row:hover .stk, .row[aria-expanded="true"] .stk { transform: translateY(-2px) scale(1.1); }
.menus .emo { margin-right: 6px; }
.deco { display: inline-block; margin-right: 4px; animation: bob 3s ease-in-out infinite; }
.row .name { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.row .name .mo { font-weight: 500; font-size: 12px; color: var(--accent-ink); }
.row .note { color: var(--muted); font-size: 14px; }
.detail { padding: 0 2px 14px; display: grid; gap: 8px; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.facts-sea { background: var(--st-sea); } .facts-veg { background: var(--st-veg); } .facts-fruit { background: var(--st-fruit); } .facts-jp { background: var(--st-jp); }
.facts dt { font-family: var(--font-display); color: var(--ink); white-space: nowrap; }
.facts dd { margin: 0; min-width: 0; }
.row .name::after { content: "▾"; margin-left: auto; font-size: 12px; color: var(--muted); transition: transform .2s; }
.row[aria-expanded="true"] .name::after { transform: rotate(180deg); }
.bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
.bar i { height: 22px; border-radius: 3px; background: var(--line); font-style: normal; font-size: 10px; display: grid; place-items: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar i.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.bar i.cur { outline: 2px solid var(--ink); outline-offset: -2px; }
.detail small { color: var(--muted); font-size: 12px; }

.empty { color: var(--muted); padding: 24px 0; }
footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
/* ---- 앱 모드 ---- */
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
button { touch-action: manipulation; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 8px 16px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
}
.tab { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; }
.tab .ic { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .7; transition: transform .2s; }
.tab[aria-current="true"] { color: var(--accent-ink); }
.tab[aria-current="true"] .ic { filter: none; opacity: 1; transform: scale(1.12); }
.icw { position: relative; line-height: 1; }
.tab .cnt { position: absolute; top: -6px; right: -14px; background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: 10px; min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px; }
.fav { justify-self: start; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--accent); color: var(--accent-ink); background: transparent; border-radius: 999px; padding: 7px 16px; }
.fav[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.row .heart { color: #e0475b; font-size: 13px; }
.favhead { display: grid; gap: 4px; }
.favhead h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.favhead p { margin: 0; color: var(--muted); font-size: 14px; }
.in-season { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 1px 7px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; transition: .25s; pointer-events: none; z-index: 20; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  기노메: [[4,5], "木の芽", "산초 새순", "봄 요리에 얹는 향긋한 잎", "산초 특유의 상쾌한 향|잎이 연하고 초록이 선명한 것|젖은 키친타월에 싸서 냉장|손바닥에 한 번 쳐서 향을 내 죽순 조림 위에"],
  쓰쿠시: [[3,4], "土筆", "쇠뜨기 새순", "들에서 따는 봄 산채", "쌉싸름한 봄맛, 조금만 먹어요|머리 부분이 닫혀 있는 것|마디 껍질(하카마)을 떼고 바로 조리|간장 조림(쓰쿠다니), 계란 볶음"],
  오카히지키: [[4,5,6], "おかひじき", "갯솔나물", "아삭한 식감의 바닷가 채소", "칼슘과 베타카로틴이 많아요|끝까지 탱탱하고 초록인 것|봉지에 넣어 냉장|데쳐서 깨무침, 샐러드"],
  모로헤이야: [[6,7,8], "モロヘイヤ", "몰로키아", "다지면 끈적해지는 여름 잎채소", "베타카로틴·칼슘이 매우 풍부해요|잎이 연하고 줄기가 가는 것|젖은 키친타월에 싸서 냉장|데쳐서 다져 간장, 국"],
  하야토우리: [[10,11], "隼人瓜", "차요테", "아삭한 박과 채소", "칼로리가 낮고 칼륨이 많아요|표면이 매끈하고 단단한 것|서늘한 곳에서 한 달|절임(아사즈케), 볶음"],
  쇼고인다이콘: [[11,12,1,2], "聖護院大根", "교토 둥근 무", "부드럽게 조려지는 둥근 무", "소화효소가 풍부해요|묵직하고 하얀 윤기가 나는 것|잎을 잘라 신문지에 싸서 냉장|무 조림(다이콘 다키), 오뎅"],
  에비이모: [[11,12,1], "海老芋", "교토 토란", "새우처럼 휜 고급 토란", "식이섬유와 칼륨이 많아요|껍질 줄무늬가 선명하고 묵직한 것|신문지에 싸서 서늘한 곳|대구포와 조림(이모보), 튀김"],
  미부나: [[12,1,2], "壬生菜", "교토 잎채소", "톡 쏘는 맛의 교토 겨울 채소", "칼슘과 비타민C가 많아요|잎끝이 싱싱하고 색이 진한 것|젖은 키친타월에 싸서 냉장|절임(쓰케모노), 나베"],
};
Object.assign(EMO, {
  광어:"🐟", 우럭:"🐟", 볼락:"🐟", 숭어:"🐟", 학꽁치:"🐟", 대게:"🦀", 청어:"🐟", 문어:"🐙", 해삼:"🌊", 개불:"🪱", 가리비:"🐚", 백합:"🐚", 꼴뚜기:"🦑", 조기:"🐟", 미역:"🌿", 톳:"🌿", 재첩:"🐚", 전갱이:"🐟", 붕장어:"🐍",
  고사리:"🌿", 참나물:"🌿", 곰취:"🍃", 돌나물:"🌱", 원추리:"🌱", 부추:"🌿", 상추:"🥬", 열무:"🥬", 아욱:"🍃", 근대:"🥬", 고구마순:"🌿", 단호박:"🎃", 능이버섯:"🍄", 땅콩:"🥜", 도라지:"🫚", 생강:"🫚", 당근:"🥕", 대파:"🧅", 시래기:"🍂", 갓:"🥬",
  금귤:"🍊", 레드향:"🍊", 황금향:"🍊", 오디:"🫐", 산딸기:"🍓", 애플망고:"🥭", 멜론:"🍈", 호두:"🌰", 잣:"🌰", 곶감:"🍊",
  신타마네기:"🧅", 신자가:"🥔", 기노메:"🌿", 쓰쿠시:"🌱", 오카히지키:"🌿", 모로헤이야:"🍃", 하야토우리:"🍐", 쇼고인다이콘:"⚪", 에비이모:"🥔", 미부나:"🥬",
});
for (const [cat, items] of Object.entries(NEW)) for (const [n, [ms, note, info]] of Object.entries(items)) { INFO[n] = info; for (const m of ms) DATA[m][cat].push(`${n}|${note}`); }
for (const [n, [ms, k, a, d, info]] of Object.entries(JP2)) { JP[n] = [k, a, d]; INFO[n] = info; for (const m of ms) DATA[m].jp.push(`${n}|${k} · ${a} · ${d}`); }

// 재료 이름 → 제철인 달 목록
const INDEX = {};
for (let m = 1; m <= 12; m++) for (const c of CATS) for (const s of DATA[m][c.id]) {
  const [name, note] = s.split("|");
  (INDEX[name] ||= { cat: c.id, months: new Set(), notes: {} }).months.add(m);
  INDEX[name].notes[m] = note;
}

const thisMonth = new Date().getMonth() + 1;
let month = thisMonth, cat = "all", query = "";
const open = new Set();
let view = "month";
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("seasonal-favs") || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("seasonal-favs", JSON.stringify([...favs])); } catch (e) {} };
try { const saved = localStorage.getItem("seasonal-cat"); if (saved) cat = saved; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function monthsText(set) {
  const a = [...set].sort((x, y) => x - y);
  // 연속 구간으로 묶기 (12월→1월 이어짐 포함)
  if (a.length === 12) return "일 년 내내";
  const runs = [];
  for (const m of a) { const r = runs[runs.length - 1]; if (r && m === r[1] + 1) r[1] = m; else runs.push([m, m]); }
  if (runs.length > 1 && runs[0][0] === 1 && runs[runs.length - 1][1] === 12) { const last = runs.pop(); runs[0][0] = last[0]; }
  return runs.map(([s, e]) => s === e ? `${s}월` : `${s}~${e}월`).join(", ");
}

function bar(name) {
  const on = INDEX[name].months;
  let h = '<div class="bar" aria-hidden="true">';
  for (let m = 1; m <= 12; m++) h += `<i class="${on.has(m) ? "on" : ""}${m === thisMonth ? " cur" : ""}">${m}</i>`;
  return h + "</div>";
}

function facts(name) {
  if (!INFO[name]) return "";
  const parts = INFO[name].split("|");
  return `<dl class="facts facts-${INDEX[name].cat}">${parts.map((p, i) => `<dt>${INFO_LABELS[i]}</dt><dd>${esc(p)}</dd>`).join("")}</dl>`;
}

function rowHTML(name, note, showMonths) {
  const key = name;
  const isOpen = open.has(key);
  return `<li><button class="row" data-key="${esc(key)}" aria-expanded="${isOpen}">${sticker(name)}<span class="txt">
    <span class="name">${esc(name)}${favs.has(name) ? '<span class="heart" aria-label="찜함">♥</span>' : ""}${showMonths ? `<span class="mo">${monthsText(INDEX[name].months)}</span>` : ""}</span>
    <span class="note">${esc(note)}</span></span></button>
    ${isOpen ? `<div class="detail">${facts(name)}${bar(name)}<small>제철: ${monthsText(INDEX[name].months)} · 테두리 칸이 이번 달</small><button class="fav" data-fav="${esc(name)}" aria-pressed="${favs.has(name)}">${favs.has(name) ? "♥ 찜했어요" : "♡ 찜하기"}</button></div>` : ""}</li>`;
}

function render() {
  const season = SEASON(month);
  document.documentElement.dataset.season = season;
  $("bigMonth").innerHTML = `${month}<small>월</small>`;
  $("seasonLabel").innerHTML = `<span class="deco">${DECO[season]}</span>${SEASON_KO[season]}`;
  buddySay();
  $("headline").textContent = month === thisMonth ? "지금 가장 맛있는 제철 음식" : `${month}월의 제철 음식`;
  $("terms").innerHTML = DATA[month].terms.map(([t, d]) => `<span class="term"><b>${t}</b>${d}</span>`).join("");

  $("strip").innerHTML = Array.from({ length: 12 }, (_, i) => {
    const m = i + 1;
    return `<button class="mbtn" data-m="${m}" aria-pressed="${m === month}"><span class="n">${m}</span><span class="s">${SEASON_KO[SEASON(m)].split(" ")[0]}</span>${m === thisMonth ? '<span class="now" title="이번 달"></span>' : ""}</button>`;
  }).join("");

  $("chips").innerHTML = [{ id: "all", label: "전체" }, ...CATS].map(c =>
    `<button class="chip" data-c="${c.id}" aria-pressed="${c.id === cat}">${c.label}</button>`).join("");

  const shown = CATS.filter(c => cat === "all" || c.id === cat);
  const q = query.trim();
  $("pick").hidden = !!q || view === "fav";
  $("favhead").hidden = view !== "fav";
  document.querySelector("header.mast").hidden = view === "fav";
  document.querySelector(".strip").hidden = view === "fav";
  $("favcnt").hidden = !favs.size; $("favcnt").textContent = favs.size;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.tab === (view === "fav" ? "fav" : (q ? "search" : "month")))));

  if (view === "fav" && !q) {
    const list = [...favs].filter(n => INDEX[n]);
    const nowCnt = list.filter(n => INDEX[n].months.has(thisMonth)).length;
    $("favsub").textContent = list.length ? `${list.length}개 중 ${nowCnt}개가 지금(${thisMonth}월) 제철이에요.` : "재료를 눌러 펼친 뒤 '찜하기'를 누르면 여기 모여요.";
    if (!list.length) { $("cols").innerHTML = ""; return; }
    list.forEach(n => open.add(n));
    $("cols").innerHTML = shown.map(c => {
      const items = list.filter(n => INDEX[n].cat === c.id).sort((a, b) => INDEX[b].months.has(thisMonth) - INDEX[a].months.has(thisMonth));
      if (!items.length) return "";
      return `<section class="cat"><h3>${c.label}<span>${items.length}개</span></h3><ul class="list">${
        items.map(n => { const ms = [...INDEX[n].months]; const m = INDEX[n].months.has(thisMonth) ? thisMonth : ms[0]; return rowHTML(n, INDEX[n].notes[m], true).replace('<span class="mo">', INDEX[n].months.has(thisMonth) ? '<span class="in-season">지금 제철</span><span class="mo">' : '<span class="mo">'); }).join("")
      }</ul></section>`;
    }).join("") || `<p class="empty">이 분류에는 찜한 재료가 없어요.</p>`;
    return;
  }

  if (q) {
    const hits = Object.keys(INDEX).filter(n => n.includes(q) || (JP[n] && JP[n].join(" ").includes(q)));
    if (!hits.length) { $("cols").innerHTML = `<p class="empty">'${esc(q)}'에 해당하는 재료가 없어요. 다른 이름으로 검색해 보세요.</p>`; return; }
    hits.forEach(n => open.add(n));
    $("cols").innerHTML = shown.map(c => {
      const items = hits.filter(n => INDEX[n].cat === c.id);
      if (!items.length) return "";
      return `<section class="cat"><h3>${c.label}<span>${items.length}개</span></h3><ul class="list">${
        items.map(n => { const ms = [...INDEX[n].months]; const m = INDEX[n].months.has(thisMonth) ? thisMonth : ms[0]; return rowHTML(n, INDEX[n].notes[m], true); }).join("")
      }</ul></section>`;
    }).join("") || `<p class="empty">이 분류에는 '${esc(q)}' 재료가 없어요.</p>`;
    return;
  }

  $("menus").innerHTML = DATA[month].menu.map(x => `<li><button class="menu" type="button" data-menu="${esc(x)}"><span class="emo">${menuEmo(x)}</span>${esc(x)}</button></li>`).join("");
  $("cols").innerHTML = shown.map(c => {
    const items = DATA[month][c.id];
    return `<section class="cat"><h3>${c.label}<span>${items.length}개</span></h3><ul class="list">${
      items.map(s => { const [n, note] = s.split("|"); return rowHTML(n, note, false); }).join("")
    }</ul></section>`;
  }).join("");
}

$("strip").addEventListener("click", e => {
  const b = e.target.closest(".mbtn"); if (!b) return;
  month = +b.dataset.m; buddyPick = 0; query = ""; $("q").value = ""; open.clear(); render();
});
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.c; try { localStorage.setItem("seasonal-cat", cat); } catch (err) {} render();
});
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
$("cols").addEventListener("click", e => {
  const f = e.target.closest(".fav");
  if (f) {
    const n = f.dataset.fav;
    if (favs.has(n)) { favs.delete(n); toast(`${n} 찜 해제`); } else { favs.add(n); toast(`${n} 찜했어요 ♥`); if (navigator.vibrate) navigator.vibrate(10); }
    saveFavs(); render(); return;
  }
  const b = e.target.closest(".row"); if (!b) return;
  const k = b.dataset.key; open.has(k) ? open.delete(k) : open.add(k); render();
  const again = document.querySelector(`.row[data-key="${CSS.escape(k)}"]`); if (again) again.focus();
});
$("buddy").addEventListener("click", () => { buddyPick++; buddySay(); });
let lastPick = "";
function openRecipe(name, random) {
  const r = RECIPE[name]; if (!r) return;
  const [meta, ing, ...steps] = r;
  const inSeason = new Set(CATS.flatMap(c => DATA[month][c.id].map(s => s.split("|")[0])));
  const isIn = t => [...inSeason].some(n => t.startsWith(n));
  const tokens = ing.split(", ");
  const hasIn = tokens.some(isIn);
  $("sheetBody").innerHTML = `<div class="rc">
    <div class="rc-top"><span class="rc-emo" aria-hidden="true">${menuEmo(name)}</span><div><div class="eyebrow">${random ? "오늘의 추천 🎲" : `${month}월 제철 상차림`}</div><h2 id="sheetTitle">${esc(name)}</h2><p class="rc-meta">⏱ ${esc(meta)}</p></div></div>
    <h3>재료</h3><ul class="rc-ing">${tokens.map(t => `<li class="${isIn(t) ? "in" : ""}">${esc(t)}</li>`).join("")}</ul>
    ${hasIn ? `<p class="rc-note">진하게 표시된 재료가 ${month}월 제철이에요</p>` : ""}
    <h3>만드는 법</h3><ol class="rc-steps">${steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    <div class="rc-btns">${random ? '<button class="dice" id="reroll" type="button">🎲 다시 뽑기</button>' : ""}<button class="close" id="closeSheet" type="button">닫기</button></div></div>`;
  $("scrim").hidden = false; $("sheet").hidden = false; $("sheet").scrollTop = 0;
  document.documentElement.style.overflow = "hidden";
  $("closeSheet").focus({ preventScroll: true });
}
function closeRecipe() { $("scrim").hidden = true; $("sheet").hidden = true; document.documentElement.style.overflow = ""; }
function rollMenu(btn) {
  const list = DATA[month].menu.filter(x => x !== lastPick);
  lastPick = list[Math.floor(Math.random() * list.length)];
  if (btn) { btn.classList.remove("rolling"); void btn.offsetWidth; btn.classList.add("rolling"); }
  if (navigator.vibrate) navigator.vibrate(15);
  openRecipe(lastPick, true);
}
$("menus").addEventListener("click", e => { const b = e.target.closest(".menu"); if (b) openRecipe(b.dataset.menu, false); });
$("dice").addEventListener("click", e => rollMenu(e.currentTarget));
$("sheet").addEventListener("click", e => { if (e.target.closest("#closeSheet")) closeRecipe(); else if (e.target.closest("#reroll")) rollMenu(e.target.closest("#reroll")); });
$("scrim").addEventListener("click", closeRecipe);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeRecipe(); });
$("q").addEventListener("input", e => { query = e.target.value; if (!query.trim()) open.clear(); render(); });
document.querySelector(".tabbar").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  const tab = t.dataset.tab;
  if (tab === "month") { view = "month"; query = ""; $("q").value = ""; open.clear(); if (month !== thisMonth) { month = thisMonth; buddyPick = 0; } render(); centerStrip(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (tab === "fav") { view = "fav"; query = ""; $("q").value = ""; open.clear(); render(); window.scrollTo({ top: 0 }); }
  else { view = "month"; render(); $("q").focus(); $("q").scrollIntoView({ block: "center", behavior: "smooth" }); }
});
function centerStrip() { const c = document.querySelector(`.mbtn[data-m="${month}"]`), s = document.querySelector(".strip"); if (c && s) s.scrollLeft = c.offsetLeft - (s.clientWidth - c.offsetWidth) / 2; }


render();
// 선택된 달이 보이도록 스트립 스크롤
const cur = document.querySelector(`.mbtn[data-m="${month}"]`), strip = document.querySelector(".strip");
if (cur && strip) strip.scrollLeft = cur.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2;
</script>

</body></html>
